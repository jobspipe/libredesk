name: JobsPipe image

# Builds the fork as one container image and pushes it to ghcr.io/jobspipe/libredesk:<short sha>.
# Upstream's release.yml needs Docker Hub secrets this fork does not have; this is the same
# frontend + stuffbin build, without goreleaser, for one platform.

on:
  push:
    branches:
      - "jobspipe/**"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g pnpm@9.15.3

      - name: Build the binary with the frontend stuffed in
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          make build LIBREDESK_VERSION="$(git describe --tags --abbrev=0)-jobspipe.$(git rev-parse --short HEAD)"
          ./libredesk --version

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          tag=ghcr.io/jobspipe/libredesk:$(git rev-parse --short=7 HEAD)
          docker build -t "$tag" .
          docker push "$tag"
          echo "pushed $tag" >> "$GITHUB_STEP_SUMMARY"
